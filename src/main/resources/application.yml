spring:
  application:
    name: trainconcierge

  datasource:
    # JDBC URL assembled from environment variables with safe local defaults.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trainconcierge_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:P@t!3nc3}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: trainconcierge-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000

  # Pagination safeguards for the Phase 1 list endpoints.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  jpa:
    # Flyway owns the schema; Hibernate must never create/alter/drop tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Only the endpoints Phase 0 needs are exposed.
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: TrainConcierge
    version: 0.0.1-SNAPSHOT
    description: TrainConcierge backend - railway master data and timetables (Phase 1)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.trainconcierge: INFO
    org.flywaydb: INFO
