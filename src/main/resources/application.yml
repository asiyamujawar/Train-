spring:
  application:
    name: trainconcierge

  datasource:
    # JDBC URL assembled from environment variables with safe local defaults.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trainconcierge_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:P@t!3nc3}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: trainconcierge-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000

  # Pagination safeguards for the Phase 1 list endpoints.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  jpa:
    # Flyway owns the schema; Hibernate must never create/alter/drop tables.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Only the endpoints Phase 0 needs are exposed.
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: TrainConcierge
    version: 0.0.1-SNAPSHOT
    description: TrainConcierge backend - railway master data and timetables (Phase 1)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.trainconcierge: INFO
    org.flywaydb: INFO

# ---------------------------------------------------------------------------
# Phase 4 - automated disruption monitoring.
# Every value can be overridden by an environment variable using relaxed
# binding, e.g. TRAINCONCIERGE_MONITORING_FIXED_DELAY_MS, TRAINCONCIERGE_MONITORING_ENABLED,
# TRAINCONCIERGE_DISRUPTION_DELAY_THRESHOLD_MINUTES, TRAINCONCIERGE_DISRUPTION_LOOKBACK_DAYS,
# TRAINCONCIERGE_DISRUPTION_FORWARD_DAYS.
# ---------------------------------------------------------------------------
trainconcierge:
  monitoring:
    # Fixed delay between monitoring runs, in milliseconds.
    fixed-delay-ms: ${TRAINCONCIERGE_MONITORING_FIXED_DELAY_MS:60000}
    # Set to false to disable the scheduled monitor (tests, local debugging).
    enabled: ${TRAINCONCIERGE_MONITORING_ENABLED:true}
  disruption:
    # A DELAYED train at or above this many minutes raises a SIGNIFICANT_DELAY event.
    delay-threshold-minutes: ${TRAINCONCIERGE_DISRUPTION_DELAY_THRESHOLD_MINUTES:30}
    # Only service dates in [today - lookback-days, today + forward-days] are monitored.
    lookback-days: ${TRAINCONCIERGE_DISRUPTION_LOOKBACK_DAYS:1}
    forward-days: ${TRAINCONCIERGE_DISRUPTION_FORWARD_DAYS:7}
  # ---------------------------------------------------------------------------
  # Phase 5 - journey impact analysis. Only journeys whose travel date is inside
  # [today - lookback-days, today + forward-days] are analysed.
  # ---------------------------------------------------------------------------
  impact:
    lookback-days: ${TRAINCONCIERGE_IMPACT_LOOKBACK_DAYS:1}
    forward-days: ${TRAINCONCIERGE_IMPACT_FORWARD_DAYS:7}
  # ---------------------------------------------------------------------------
  # Phase 6 - alternative train recommendations. Deterministic candidate search
  # and ranking over Phases 1-5 data; no external calls.
  # ---------------------------------------------------------------------------
  recommendation:
    # Minimum minutes a replacement must leave between its arrival and the next
    # leg's scheduled departure for the connection to be treated as reachable.
    min-transfer-buffer-minutes: ${TRAINCONCIERGE_RECOMMENDATION_MIN_TRANSFER_BUFFER_MINUTES:15}
    # Maximum number of recommendations kept (and returned) per impact.
    max-results-per-impact: ${TRAINCONCIERGE_RECOMMENDATION_MAX_RESULTS_PER_IMPACT:10}
    # Maximum number of impacts reconciled by one bounded batch run.
    max-impacts-per-run: ${TRAINCONCIERGE_RECOMMENDATION_MAX_IMPACTS_PER_RUN:50}
